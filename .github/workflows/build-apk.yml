name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web files and patch project
        run: |
          npx cap sync android
          node scripts/patch-android.js

      - name: Install signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Długość sekretu KEYSTORE_BASE64: ${#KEYSTORE_BASE64} znaków (0 = pusty albo brak sekretu)"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sekret KEYSTORE_BASE64 jest pusty lub nie istnieje. Sprawdź nazwę (dokładnie KEYSTORE_BASE64) i wklej wartość ponownie w Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/sentinel.keystore
          ls -l android/app/sentinel.keystore

      - name: Build APK (stable signature)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
